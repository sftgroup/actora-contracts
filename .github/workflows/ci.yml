name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSL --http1.1 --retry 3 --retry-delay 2 -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks dir -c .gitleaks.toml --no-banner --redact --exit-code 1 .
  contracts:
    name: Contracts (build + test + frozen ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge build
      - run: forge test
      - run: ./tools/frozen-abi.sh
